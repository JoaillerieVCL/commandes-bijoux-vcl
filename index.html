<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a1510"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Commandes Bijoux — Joaillerie VCL</title>
<style>
:root{--bg:#0f0d0b;--s:#1a1510;--s2:#241e18;--b:#3a3228;--t:#f5efe6;--m:#a89a88;--g:#c9a227;--gs:#e8d48b;--ok:#3d8b6e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(900px 500px at 20% -10%,#2a2218,var(--bg));color:var(--t);line-height:1.45;padding:16px 16px 48px;max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:40px;height:40px;border-radius:11px;background:#3a2f22;border:1px solid var(--b);display:grid;place-items:center}
h1{font-size:1.05rem}.sub{font-size:.75rem;color:var(--m)}
.card{background:linear-gradient(180deg,var(--s),#16120e);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 8px 32px #0005}
.tabs{display:flex;gap:6px;background:var(--s);border:1px solid var(--b);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:0;color:var(--m);padding:10px;border-radius:9px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--s2);color:var(--t)}
label{display:block;font-size:.78rem;color:var(--m);margin:0 0 6px}
.field{margin-bottom:12px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.98)}
.pri{background:linear-gradient(180deg,var(--gs),var(--g));color:#1a1208}
.sec{background:var(--s2);border:1px solid var(--b);color:var(--t)}
.ghost{background:0;border:1px solid var(--b);color:var(--m)}
.ok{background:var(--ok);color:#fff}
.dang{background:0;border:1px solid #b54a3a;color:#e8a89e}
.block{width:100%}.sm{padding:8px 12px;font-size:.85rem;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.badge{font-size:.72rem;font-weight:650;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--b);color:var(--m)}
.badge.wait{background:#c97b2a22;color:#f0b56a;border-color:#c97b2a55}
.badge.done{background:#3d8b6e22;color:#7dceb0;border-color:#3d8b6e55}
.item{border:1px solid var(--b);border-radius:12px;padding:14px;background:var(--s2);margin-bottom:10px}
.item h3{font-size:.95rem}.meta{font-size:.8rem;color:var(--m);margin:6px 0 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.notice{background:#c9a22714;border:1px solid #c9a22740;border-radius:12px;padding:12px;font-size:.88rem;color:var(--gs);margin-bottom:12px}
.chip{font-size:.75rem;padding:4px 8px;border-radius:999px;background:#2a241c;border:1px solid var(--b);color:var(--m);display:inline-block;margin:2px}
.chip.miss{color:#f0b56a;border-color:#c97b2a66}.chip.ok{color:#7dceb0;border-color:#3d8b6e66}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(max-width:420px){.checks{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:10px;font-size:.85rem;cursor:pointer}
.check input{width:auto;accent-color:var(--g)}
.linkbox{display:flex;gap:8px}.linkbox input{flex:1;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);background:#2a241c;border:1px solid var(--b);padding:12px 16px;border-radius:12px;z-index:50;transition:.25s;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.foot{text-align:center;color:var(--m);font-size:.75rem;margin-top:20px}
.center{text-align:center;padding:28px 12px}
.req::after{content:" *";color:var(--g)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
